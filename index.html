<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de QR y Códigos de Barras</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Html5-Qrcode CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .serial-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-barcode text-indigo-400"></i> Escáner e Inventario
            </h1>
            <!-- Contadores rápidos -->
            <div class="flex items-center gap-3 bg-gray-900 px-4 py-2 rounded-xl border border-gray-700 text-sm">
                <div>Total Registros: <span id="total-count" class="font-bold text-indigo-400">0</span></div>
                <div class="h-4 w-px bg-gray-700"></div>
                <div>Elementos Únicos: <span id="unique-count" class="font-bold text-emerald-400">0</span></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col gap-6">

        <!-- Panel de Control y Configuración -->
        <section class="bg-gray-800 p-5 rounded-2xl border border-gray-700 shadow-lg flex flex-col gap-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Selector de Etiqueta -->
                <div class="flex flex-col gap-1.5">
                    <label for="tag-select" class="text-sm font-medium text-gray-300">
                        <i class="fa-solid fa-tag text-indigo-400 mr-1"></i> Asignar Etiqueta / Categoría:
                    </label>
                    <div class="flex gap-2">
                        <select id="tag-select" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 flex-grow">
                            <option value="Impresoras">Impresoras</option>
                            <option value="Escáneres">Escáneres</option>
                            <option value="Computadoras">Computadoras</option>
                            <option value="Monitores">Monitores</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                        <button onclick="addNewTag()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-sm transition font-medium" title="Añadir nueva categoría">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Selector de Cámara -->
                <div class="flex flex-col gap-1.5">
                    <label for="camera-select" class="text-sm font-medium text-gray-300">
                        <i class="fa-solid fa-camera text-indigo-400 mr-1"></i> Cámara:
                    </label>
                    <select id="camera-select" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                        <option value="">Cargando cámaras...</option>
                    </select>
                </div>
            </div>

            <!-- Botones de Acción de Cámara y Manual -->
            <div class="flex flex-wrap gap-3 pt-2 border-t border-gray-700">
                <button id="btn-start" onclick="startScanner()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-md">
                    <i class="fa-solid fa-play"></i> Iniciar Escáner
                </button>
                <button id="btn-stop" onclick="stopScanner()" class="bg-rose-600 hover:bg-rose-500 text-white font-medium px-4 py-2.5 rounded-xl transition hidden flex items-center gap-2 shadow-md">
                    <i class="fa-solid fa-stop"></i> Detener Cámara
                </button>
                <button onclick="openManualModal()" class="bg-gray-700 hover:bg-gray-600 text-white font-medium px-4 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-keyboard"></i> Ingreso Manual
                </button>
            </div>
        </section>

        <!-- Visor del Escáner (Oculto por defecto con Previsualización de Código y Botón de Confirmación) -->
        <section id="scanner-container-wrapper" class="hidden bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-lg flex flex-col items-center gap-4">
            <div id="reader" class="w-full max-w-md rounded-xl overflow-hidden border border-gray-700 relative"></div>
            
            <!-- Recuadro flotante de confirmación de lectura -->
            <div class="w-full max-w-md bg-gray-900/90 border border-gray-700 p-3.5 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
                <div class="flex flex-col overflow-hidden text-center sm:text-left w-full">
                    <span class="text-xs text-gray-400 flex items-center justify-center sm:justify-start gap-1">
                        <i class="fa-solid fa-eye text-indigo-400"></i> Código detectado:
                    </span>
                    <span id="detected-code-display" class="serial-text text-white font-bold text-base truncate mt-0.5">Ninguno (Apunta un código)</span>
                </div>
                <button id="btn-confirm-code" onclick="confirmDetectedCode()" disabled class="w-full sm:w-auto bg-gray-700 text-gray-400 font-medium px-4 py-2 rounded-lg transition flex items-center justify-center gap-1.5 cursor-not-allowed whitespace-nowrap">
                    <i class="fa-solid fa-check"></i> Registrar
                </button>
            </div>
        </section>

        <!-- Tabla de Registros -->
        <section class="bg-gray-800 rounded-2xl border border-gray-700 shadow-lg flex flex-col overflow-hidden">
            <div class="p-4 bg-gray-800/80 border-b border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-3">
                <h2 class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-400"></i> Elementos Registrados
                </h2>
                <!-- Botones de Exportación y Limpieza -->
                <div class="flex flex-wrap gap-2">
                    <button onclick="exportJSON()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                        <i class="fa-solid fa-file-code"></i> JSON
                    </button>
                    <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                        <i class="fa-solid fa-file-csv"></i> CSV
                    </button>
                    <button onclick="clearList()" class="bg-rose-600/80 hover:bg-rose-600 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> Limpiar
                    </button>
                </div>
            </div>

            <!-- Tabla Optimizada -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/60 text-gray-400 text-xs uppercase tracking-wider border-b border-gray-700">
                            <th class="py-3 px-4">Número de Serie</th>
                            <th class="py-3 px-4">Etiqueta</th>
                            <th class="py-3 px-4 text-center">Cant</th>
                            <th class="py-3 px-4">Fecha y Hora</th>
                            <th class="py-3 px-4 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="items-table-body" class="divide-y divide-gray-700/50 text-sm">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>
            <!-- Estado Vacío -->
            <div id="empty-state" class="p-8 text-center text-gray-400 hidden">
                <i class="fa-solid fa-box-open text-4xl mb-2 text-gray-600"></i>
                <p>No hay elementos registrados todavía.</p>
            </div>
        </section>
    </main>

    <!-- Modal para Ingreso Manual -->
    <div id="manual-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-md w-full p-6 shadow-2xl flex flex-col gap-4">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-keyboard text-indigo-400"></i> Ingresar Código Manualmente
            </h3>
            <div class="flex flex-col gap-1.5">
                <label class="text-sm text-gray-300">Número de Serie / Código:</label>
                <input type="text" id="manual-input-code" placeholder="Ej: 7501001300209" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 serial-text">
            </div>
            <div class="flex justify-end gap-2 mt-2">
                <button onclick="closeManualModal()" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-xl text-sm transition">Cancelar</button>
                <button onclick="submitManualCode()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm transition font-medium">Registrar</button>
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let html5QrCode = null;
        let currentCameraId = null;
        let items = [];
        let activeDetectedCode = null; // Código actualmente en vista para confirmar

        const tagColors = {
            "Impresoras": "bg-indigo-950/40 text-indigo-300 border-indigo-800/50",
            "Escáneres": "bg-purple-950/40 text-purple-300 border-purple-800/50",
            "Computadoras": "bg-blue-950/40 text-blue-300 border-blue-800/50",
            "Monitores": "bg-emerald-950/40 text-emerald-300 border-emerald-800/50",
            "Accesorios": "bg-amber-950/40 text-amber-300 border-amber-800/50"
        };

        function getTagStyle(tag) {
            if (tagColors[tag]) return tagColors[tag];
            return "bg-gray-950/40 text-gray-300 border-gray-700/50";
        }

        // Sonido de confirmación
        function playSuccessSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('qr_inventory_items');
            if (saved) {
                try { items = JSON.parse(saved); } catch(e) { items = []; }
            }
            renderTable();
            initCameras();
        });

        async function initCameras() {
            const cameraSelect = document.getElementById('camera-select');
            try {
                const devices = await Html5Qrcode.getCameras();
                if (devices && devices.length > 0) {
                    cameraSelect.innerHTML = '';
                    let backCameraId = devices[0].id;

                    devices.forEach((device, index) => {
                        const option = document.createElement('option');
                        option.value = device.id;
                        option.text = device.label || `Cámara ${index + 1}`;
                        cameraSelect.appendChild(option);

                        const labelLower = (device.label || "").toLowerCase();
                        if (labelLower.includes('back') || labelLower.includes('rear') || labelLower.includes('trasera') || labelLower.includes('environment')) {
                            backCameraId = device.id;
                        }
                    });

                    cameraSelect.value = backCameraId;
                    currentCameraId = backCameraId;
                } else {
                    cameraSelect.innerHTML = '<option value="">No se encontraron cámaras</option>';
                }
            } catch (err) {
                console.error("Error obteniendo cámaras", err);
                cameraSelect.innerHTML = '<option value="">Error de permisos de cámara</option>';
            }
        }

        async function startScanner() {
            const select = document.getElementById('camera-select');
            const cameraId = select.value;
            if (!cameraId) {
                alert("Selecciona una cámara válida.");
                return;
            }

            document.getElementById('scanner-container-wrapper').classList.remove('hidden');
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-stop').classList.remove('hidden');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            try {
                await html5QrCode.start(
                    cameraId,
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        // Muestra el código en tiempo real en la barra inferior sin registrarlo aún
                        setDetectedCode(decodedText);
                    },
                    (errorMessage) => {}
                );
            } catch (err) {
                console.error("No se pudo iniciar la cámara", err);
                stopScanner();
                alert("No se pudo acceder a la cámara. Revisa los permisos del navegador.");
            }
        }

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (err) {}
            }
            document.getElementById('scanner-container-wrapper').classList.add('hidden');
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('btn-stop').classList.add('hidden');
            clearDetectedCodeDisplay();
        }

        function setDetectedCode(code) {
            activeDetectedCode = code;
            const display = document.getElementById('detected-code-display');
            const btnConfirm = document.getElementById('btn-confirm-code');

            display.textContent = code;
            display.classList.remove('text-gray-400');
            display.classList.add('text-white');

            btnConfirm.disabled = false;
            btnConfirm.className = "w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg transition flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap shadow-md";
        }

        function clearDetectedCodeDisplay() {
            activeDetectedCode = null;
            const display = document.getElementById('detected-code-display');
            const btnConfirm = document.getElementById('btn-confirm-code');

            display.textContent = "Ninguno (Apunta un código)";
            display.classList.remove('text-white');
            display.classList.add('text-gray-400');

            btnConfirm.disabled = true;
            btnConfirm.className = "w-full sm:w-auto bg-gray-700 text-gray-400 font-medium px-4 py-2 rounded-lg transition flex items-center justify-center gap-1.5 cursor-not-allowed whitespace-nowrap";
        }

        // El usuario confirma y almacena el código que tiene en pantalla
        function confirmDetectedCode() {
            if (!activeDetectedCode) return;

            playSuccessSound();
            if (navigator.vibrate) navigator.vibrate(100);

            processItemRegistration(activeDetectedCode);
            
            // Opcional: limpiar la visualización temporal para enfocar el siguiente
            clearDetectedCodeDisplay();
        }

        function processItemRegistration(code) {
            const tagSelect = document.getElementById('tag-select');
            const currentTag = tagSelect.value;
            const nowStr = new Date().toLocaleString();

            const existingIndex = items.findIndex(item => item.code === code);

            if (existingIndex !== -1) {
                items[existingIndex].quantity = (items[existingIndex].quantity || 1) + 1;
                items[existingIndex].date = nowStr;
                items[existingIndex].tag = currentTag;
            } else {
                items.unshift({
                    code: code,
                    tag: currentTag,
                    quantity: 1,
                    date: nowStr
                });
            }

            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('qr_inventory_items', JSON.stringify(items));
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('items-table-body');
            const emptyState = document.getElementById('empty-state');
            const totalCountEl = document.getElementById('total-count');
            const uniqueCountEl = document.getElementById('unique-count');

            tbody.innerHTML = '';

            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                totalCountEl.textContent = '0';
                uniqueCountEl.textContent = '0';
                return;
            }

            emptyState.classList.add('hidden');

            let totalUnits = 0;
            items.forEach((item, index) => {
                totalUnits += (item.quantity || 1);
                const tagClass = getTagStyle(item.tag);

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-700/30 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 serial-text font-semibold text-indigo-300">${escapeHtml(item.code)}</td>
                    <td class="py-3 px-4">
                        <span class="inline-block px-2.5 py-1 rounded-lg border text-xs font-medium ${tagClass}">${escapeHtml(item.tag)}</span>
                    </td>
                    <td class="py-3 px-4 text-center font-bold">${item.quantity || 1}</td>
                    <td class="py-3 px-4 text-gray-400 text-xs">${escapeHtml(item.date)}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="deleteItem(${index})" class="text-rose-400 hover:text-rose-300 p-1.5 rounded-lg hover:bg-rose-950/40 transition" title="Eliminar elemento">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            totalCountEl.textContent = totalUnits;
            uniqueCountEl.textContent = items.length;
        }

        function deleteItem(index) {
            if (confirm("¿Estás seguro de eliminar este elemento?")) {
                items.splice(index, 1);
                saveAndRender();
            }
        }

        function clearList() {
            if (confirm("¿Vaciar toda la lista de registros? Esta acción no se puede deshacer.")) {
                items = [];
                saveAndRender();
            }
        }

        function addNewTag() {
            const newTag = prompt("Ingresa el nombre de la nueva etiqueta (ej: Servidores, Teléfonos):");
            if (newTag && newTag.trim() !== "") {
                const formatted = newTag.trim();
                const select = document.getElementById('tag-select');
                
                let exists = false;
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value.toLowerCase() === formatted.toLowerCase()) {
                        exists = true;
                        break;
                    }
                }

                if (!exists) {
                    const opt = document.createElement('option');
                    opt.value = formatted;
                    opt.textContent = formatted;
                    select.appendChild(opt);
                    select.value = formatted;
                } else {
                    select.value = formatted;
                }
            }
        }

        function openManualModal() {
            document.getElementById('manual-input-code').value = '';
            document.getElementById('manual-modal').classList.remove('hidden');
            document.getElementById('manual-input-code').focus();
        }

        function closeManualModal() {
            document.getElementById('manual-modal').classList.add('hidden');
        }

        function submitManualCode() {
            const code = document.getElementById('manual-input-code').value.trim();
            if (!code) {
                alert("Por favor ingresa un número de serie o código válido.");
                return;
            }
            processItemRegistration(code);
            closeManualModal();
        }

        function exportJSON() {
            if (items.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `inventario_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function exportCSV() {
            if (items.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Serie,Etiqueta,Cantidad,Fecha\r\n";
            items.forEach(item => {
                const row = [
                    `"${item.code.replace(/"/g, '""')}"`,
                    `"${item.tag.replace(/"/g, '""')}"`,
                    item.quantity || 1,
                    `"${item.date.replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", encodedUri);
            downloadAnchor.setAttribute("download", `inventario_${Date.now()}.csv`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
